input {
  beats { port => 5044 }
}

filter {
  # The honeypot services already emit JSON. Just normalize field names.
  date {
    match => ["ts", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }

  # Tag obvious attack categories for quick Kibana filtering
  if [event] == "cve_exploit_attempt" {
    mutate { add_tag => ["attack", "cve"] }
  }
  if [event] == "ssh_dropper_url" {
    mutate { add_tag => ["attack", "malware-dropper"] }
  }
  if [event] == "ssh_auth_password" {
    mutate { add_tag => ["credential-capture"] }
  }
  if [event] == "recon_scan" {
    mutate { add_tag => ["recon", "scanner"] }
  }

  # Geo-enrich source IP (uses bundled GeoLite2 DB)
  if [src_ip] and [src_ip] !~ "^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.)" {
    geoip {
      source => "src_ip"
      target => "geo"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "honeypot-events-%{+YYYY.MM.dd}"
  }
  # stdout { codec => rubydebug }   # uncomment for debugging
}
