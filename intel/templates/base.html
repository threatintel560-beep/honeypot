<!doctype html>
<html lang="en" class="h-full bg-[#0a0e17] text-slate-200">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HoneyForge Intel{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'hf-bg': '#0a0e17',
        'hf-card': '#111827',
        'hf-border': '#1e293b',
        'hf-accent': '#06b6d4',
        'hf-glow': '#22d3ee',
      },
      fontFamily: {
        mono: ['JetBrains Mono', 'Fira Code', 'SF Mono', 'monospace'],
      }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  .font-mono, code, pre, textarea { font-family: 'JetBrains Mono', monospace; }
  
  /* Glow effects */
  .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.15), inset 0 1px 0 rgba(6, 182, 212, 0.1); }
  .glow-amber { box-shadow: 0 0 20px rgba(245, 158, 11, 0.15), inset 0 1px 0 rgba(245, 158, 11, 0.1); }
  .glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.15), inset 0 1px 0 rgba(239, 68, 68, 0.1); }
  .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.15), inset 0 1px 0 rgba(34, 197, 94, 0.1); }
  
  /* Terminal style */
  .terminal { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; }
  .terminal-header { background: #161b22; border-bottom: 1px solid #21262d; padding: 8px 12px; border-radius: 8px 8px 0 0; }
  .terminal-dots { display: flex; gap: 6px; }
  .terminal-dots span { width: 10px; height: 10px; border-radius: 50%; }
  .terminal-dots .red { background: #ff5f57; }
  .terminal-dots .yellow { background: #febc2e; }
  .terminal-dots .green { background: #28c840; }
  
  /* Chips */
  .chip { @apply inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium; }
  .chip-critical { @apply bg-red-900/60 text-red-200 ring-1 ring-red-500/40; }
  .chip-high { @apply bg-orange-900/60 text-orange-200 ring-1 ring-orange-500/40; }
  .chip-medium { @apply bg-yellow-900/60 text-yellow-200 ring-1 ring-yellow-500/40; }
  .chip-low { @apply bg-green-900/60 text-green-200 ring-1 ring-green-500/40; }
  .chip-crit { @apply bg-red-900/60 text-red-200 ring-1 ring-red-500/40; }
  .chip-kev { @apply bg-fuchsia-900/60 text-fuchsia-200 ring-1 ring-fuchsia-500/40; }
  .chip-new { @apply bg-cyan-900/60 text-cyan-200 ring-1 ring-cyan-500/40; }
  .chip-drafted { @apply bg-amber-900/60 text-amber-200 ring-1 ring-amber-500/40; }
  .chip-plugin { @apply bg-amber-900/60 text-amber-200 ring-1 ring-amber-500/40; }
  .chip-deployed { @apply bg-emerald-900/60 text-emerald-200 ring-1 ring-emerald-500/40; }
  .chip-reviewed { @apply bg-teal-900/60 text-teal-200 ring-1 ring-teal-500/40; }
  .chip-draft { @apply bg-slate-700/60 text-slate-200 ring-1 ring-slate-500/40; }
  .chip-researched { @apply bg-blue-900/60 text-blue-200 ring-1 ring-blue-500/40; }
  .chip-skipped { @apply bg-slate-800 text-slate-400 ring-1 ring-slate-600; }
  
  /* Buttons */
  .link { @apply text-cyan-400 hover:text-cyan-300 underline-offset-4 hover:underline; }
  .btn { @apply inline-flex items-center gap-1.5 rounded-md bg-slate-800 px-3 py-1.5 text-sm font-medium text-slate-100 ring-1 ring-slate-700 hover:bg-slate-700 transition-all; }
  .btn-primary { @apply inline-flex items-center gap-1.5 rounded-md bg-cyan-600 px-3 py-1.5 text-sm font-medium text-white ring-1 ring-cyan-500 hover:bg-cyan-500 transition-all hover:shadow-lg hover:shadow-cyan-500/20; }
  .btn-danger { @apply inline-flex items-center gap-1.5 rounded-md bg-red-600 px-3 py-1.5 text-sm font-medium text-white ring-1 ring-red-500 hover:bg-red-500 transition-all; }
  .btn-success { @apply inline-flex items-center gap-1.5 rounded-md bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white ring-1 ring-emerald-500 hover:bg-emerald-500 transition-all; }
  
  /* Navigation */
  .nav-link { @apply inline-flex items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-white transition-all; }
  .nav-link.active { @apply bg-slate-800/80 text-white ring-1 ring-slate-700; }
  
  /* Cards */
  .card { @apply rounded-lg bg-[#111827] ring-1 ring-[#1e293b] p-5; }
  .card-glow { @apply rounded-lg bg-[#111827] ring-1 ring-cyan-900/50 p-5 glow-cyan; }
  
  /* Tables */
  table.data { @apply w-full text-sm text-left; }
  table.data thead { @apply bg-[#0d1117] text-slate-500 text-xs uppercase tracking-wider; }
  table.data th, table.data td { @apply px-3 py-2.5 border-b border-[#1e293b]; }
  table.data tbody tr:hover { @apply bg-slate-800/30; }
  
  /* Forms */
  input, select, textarea { @apply bg-[#0d1117] border border-[#1e293b] rounded-md px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-1 focus:ring-cyan-500 focus:border-cyan-500 transition-all; }
  label { @apply block text-sm font-medium text-slate-400 mb-1; }
  .hint { @apply text-xs text-slate-600 mt-1; }
  
  /* Pulse animation for live indicators */
  @keyframes pulse-glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .pulse-live { animation: pulse-glow 2s ease-in-out infinite; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0a0e17; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }
</style>
</head>
<body class="min-h-full">
<header class="border-b border-[#1e293b] bg-[#0a0e17]/95 backdrop-blur-xl sticky top-0 z-50">
  <div class="max-w-[1600px] mx-auto px-6 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 group">
      <div class="relative">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyan-400 pulse-live"></span>
        <span class="absolute inset-0 w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping opacity-30"></span>
      </div>
      <span class="text-xl font-bold tracking-tight text-white">Honey<span class="text-cyan-400">Forge</span></span>
      <span class="text-xs font-mono text-slate-600 hidden sm:inline">v0.2.0</span>
    </a>
    <nav class="flex gap-1">
      <a href="/"          class="nav-link {% if active=='dashboard' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
        Dashboard
      </a>
      <a href="/cves"      class="nav-link {% if active=='cves' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
        CVEs
      </a>
      <a href="/plugins"   class="nav-link {% if active=='plugins' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        Plugins
      </a>
      <a href="/services"  class="nav-link {% if active=='services' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"/></svg>
        Services
      </a>
      <a href="/iocs"      class="nav-link {% if active=='iocs' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        IOCs
      </a>
      <a href="/stix"      class="nav-link {% if active=='stix' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        STIX
      </a>
      <a href="/network"   class="nav-link {% if active=='network' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
        Network
      </a>
      <a href="/config"    class="nav-link {% if active=='config' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Config
      </a>
    </nav>
  </div>
</header>
<main class="max-w-[1600px] mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>
<footer class="border-t border-[#1e293b] mt-12 py-4">
  <div class="max-w-[1600px] mx-auto px-6 flex items-center justify-between text-xs text-slate-600">
    <span>HoneyForge Intel · Threat Intelligence Platform</span>
    <span class="font-mono">TAXII 2.1: /taxii2/ · Pipeline: auto_kev</span>
  </div>
</footer>
</body>
</html>
