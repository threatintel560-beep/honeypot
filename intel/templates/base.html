<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HoneyForge{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        // Claude-inspired warm palette
        cream: {
          50:  '#faf9f6',
          100: '#f5f4ed',
          200: '#ede9db',
          300: '#ddd6c1',
        },
        ink: {
          50:  '#f7f7f5',
          100: '#e8e6e1',
          200: '#c9c5bc',
          300: '#a8a39a',
          400: '#87837b',
          500: '#63605a',
          600: '#4a4844',
          700: '#38362f',
          800: '#272722',
          900: '#1a1a17',
          950: '#0f0f0d',
        },
        coral: {
          50:  '#fff4f0',
          100: '#ffe4d9',
          200: '#ffc4ad',
          300: '#ff9f7a',
          400: '#f97a4d',
          500: '#d97757',  // Claude's signature orange
          600: '#c15f3a',
          700: '#9e4e30',
          800: '#82402a',
          900: '#6a3624',
        },
      },
      fontFamily: {
        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
        serif: ['"Crimson Pro"', 'Georgia', 'serif'],
        mono: ['"JetBrains Mono"', '"SF Mono"', 'ui-monospace', 'monospace'],
      },
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Crimson+Pro:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { 
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; 
    background: #faf9f6;
    color: #272722;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  .font-serif { font-family: 'Crimson Pro', Georgia, serif; font-feature-settings: 'liga', 'kern'; }
  .font-mono, code, pre, textarea.code { font-family: 'JetBrains Mono', 'SF Mono', monospace; }

  /* Core components */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.5rem 0.875rem;
    background: #ffffff;
    color: #272722;
    border: 1px solid #c9c5bc;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn:hover { background: #f7f7f5; border-color: #a8a39a; }
  .btn:active { transform: translateY(1px); }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.5rem 0.875rem;
    background: #d97757;
    color: #ffffff;
    border: 1px solid #c15f3a;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-primary:hover { background: #c15f3a; }
  .btn-primary:active { transform: translateY(1px); }

  .btn-danger {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.5rem 0.875rem;
    background: #ffffff;
    color: #c15f3a;
    border: 1px solid #ffc4ad;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-danger:hover { background: #fff4f0; border-color: #f97a4d; color: #9e4e30; }

  /* Navigation */
  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.875rem;
    color: #63605a;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    transition: all 0.15s ease;
  }
  .nav-link:hover { background: #f5f4ed; color: #272722; }
  .nav-link.active { 
    background: #272722; 
    color: #faf9f6;
  }

  /* Cards */
  .card {
    background: #ffffff;
    border: 1px solid #ede9db;
    border-radius: 0.875rem;
    padding: 1.5rem;
    box-shadow: 0 1px 2px rgba(39, 39, 34, 0.04);
  }
  .card-quiet {
    background: #f7f7f5;
    border: 1px solid #ede9db;
    border-radius: 0.875rem;
    padding: 1.5rem;
  }

  /* Chips / Tags */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.125rem 0.5rem;
    border-radius: 0.375rem;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.25;
  }
  .chip-critical { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .chip-high { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
  .chip-medium { background: #fefce8; color: #854d0e; border: 1px solid #fde68a; }
  .chip-low { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .chip-crit { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .chip-kev { background: #fdf4ff; color: #86198f; border: 1px solid #f5d0fe; }
  .chip-new { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .chip-researched { background: #f0f9ff; color: #075985; border: 1px solid #bae6fd; }
  .chip-plugin, .chip-drafted { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
  .chip-deployed { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .chip-reviewed { background: #ecfeff; color: #155e75; border: 1px solid #a5f3fc; }
  .chip-draft { background: #f7f7f5; color: #63605a; border: 1px solid #c9c5bc; }
  .chip-skipped { background: #f7f7f5; color: #87837b; border: 1px solid #c9c5bc; }

  /* Forms — critical contrast fixes */
  input[type="text"],
  input[type="password"],
  input[type="email"],
  input[type="number"],
  input[type="search"],
  input[type="url"],
  input:not([type]),
  select,
  textarea {
    background: #ffffff !important;
    color: #272722 !important;
    border: 1px solid #c9c5bc !important;
    border-radius: 0.5rem !important;
    padding: 0.5rem 0.75rem !important;
    font-size: 0.875rem !important;
    outline: none !important;
    transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #d97757 !important;
    box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.15) !important;
  }
  input::placeholder, textarea::placeholder {
    color: #a8a39a !important;
  }
  select option {
    background: #ffffff;
    color: #272722;
  }
  label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 500;
    color: #4a4844;
    margin-bottom: 0.375rem;
  }
  .hint {
    font-size: 0.75rem;
    color: #87837b;
    margin-top: 0.375rem;
    line-height: 1.5;
  }

  /* Links */
  .link {
    color: #d97757;
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .link:hover {
    color: #c15f3a;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Tables */
  table.data {
    width: 100%;
    text-align: left;
    border-collapse: collapse;
  }
  table.data thead tr {
    border-bottom: 1px solid #ede9db;
  }
  table.data th {
    padding: 0.625rem 0.875rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: #63605a;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  table.data td {
    padding: 0.75rem 0.875rem;
    font-size: 0.875rem;
    color: #272722;
    border-bottom: 1px solid #f5f4ed;
  }
  table.data tbody tr:hover {
    background: #faf9f6;
  }
  table.data tbody tr:last-child td {
    border-bottom: none;
  }

  /* Code blocks */
  pre.code-block, .terminal {
    background: #272722;
    color: #e8e6e1;
    border-radius: 0.75rem;
    border: 1px solid #38362f;
    overflow: hidden;
  }
  .terminal-header {
    background: #1a1a17;
    border-bottom: 1px solid #38362f;
    padding: 0.625rem 0.875rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .terminal-dots { display: flex; gap: 0.375rem; }
  .terminal-dots span {
    width: 0.75rem;
    height: 0.75rem;
    border-radius: 9999px;
    background: #4a4844;
  }
  .terminal-body {
    padding: 1rem 1.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8125rem;
    line-height: 1.7;
    color: #c9c5bc;
  }
  .terminal-body .prompt { color: #d97757; }
  .terminal-body .comment { color: #63605a; }
  .terminal-body .keyword { color: #8fb9a8; }
  .terminal-body .string { color: #e8c99b; }

  /* Inline code */
  .prose code, p code, li code, span code {
    background: #f5f4ed;
    color: #4a4844;
    padding: 0.125rem 0.375rem;
    border-radius: 0.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8125em;
    border: 1px solid #ede9db;
  }

  /* Stat cards */
  .stat-card {
    background: #ffffff;
    border: 1px solid #ede9db;
    border-radius: 0.875rem;
    padding: 1.25rem;
    transition: all 0.2s ease;
  }
  .stat-card:hover {
    border-color: #ddd6c1;
    box-shadow: 0 4px 12px rgba(39, 39, 34, 0.06);
  }

  /* Status indicator */
  .status-dot {
    display: inline-block;
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 9999px;
    background: #10b981;
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
  }
  .status-dot.offline { background: #a8a39a; box-shadow: none; }
  
  @keyframes pulse-subtle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .pulse-live { animation: pulse-subtle 2.5s ease-in-out infinite; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #faf9f6; }
  ::-webkit-scrollbar-thumb { background: #ddd6c1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #c9c5bc; }

  /* Details/Summary */
  details summary {
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary .arrow { transform: rotate(90deg); }
  .arrow { transition: transform 0.2s ease; display: inline-block; }

  /* Code textarea */
  textarea.code {
    background: #272722 !important;
    color: #e8e6e1 !important;
    border: 1px solid #38362f !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 0.75rem !important;
    line-height: 1.6 !important;
    padding: 1rem !important;
  }
  textarea.code:focus {
    border-color: #d97757 !important;
    box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.15) !important;
  }

  /* Notice banners */
  .notice {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #7c2d12;
    border-radius: 0.75rem;
    padding: 0.875rem 1rem;
    font-size: 0.875rem;
  }
  .notice-info {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
    border-radius: 0.75rem;
    padding: 0.875rem 1rem;
    font-size: 0.875rem;
  }

  /* Section headers */
  .section-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: #63605a;
    text-transform: uppercase;
    letter-spacing: 0.075em;
    margin-bottom: 0.875rem;
  }

  /* Smooth fade in */
  [x-cloak] { display: none !important; }
</style>
</head>
<body class="min-h-full">

<!-- Top nav -->
<header class="sticky top-0 z-40 bg-cream-50/95 backdrop-blur-sm border-b border-cream-200">
  <div class="max-w-[1680px] mx-auto px-6">
    <div class="flex items-center justify-between h-14">
      <a href="/" class="flex items-center gap-3">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-coral-400 to-coral-600 flex items-center justify-center shadow-sm">
          <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.236L18.618 8 12 11.764 5.382 8 12 4.236zM5 9.854l6 3.4v6.927l-6-3.333V9.854zm8 10.327v-6.927l6-3.4v6.994l-6 3.333z"/></svg>
        </div>
        <div>
          <div class="font-serif text-lg leading-none text-ink-900">HoneyForge</div>
          <div class="text-[10px] font-mono text-ink-400 mt-0.5 tracking-wider">INTEL v0.3</div>
        </div>
      </a>
      
      <nav class="flex items-center gap-1">
        <a href="/"          class="nav-link {% if active=='dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/cves"      class="nav-link {% if active=='cves' %}active{% endif %}">CVEs</a>
        <a href="/plugins"   class="nav-link {% if active=='plugins' %}active{% endif %}">Plugins</a>
        <a href="/services"  class="nav-link {% if active=='services' %}active{% endif %}">Services</a>
        <a href="/iocs"      class="nav-link {% if active=='iocs' %}active{% endif %}">IOCs</a>
        <a href="/stix"      class="nav-link {% if active=='stix' %}active{% endif %}">STIX</a>
        <a href="/network"   class="nav-link {% if active=='network' %}active{% endif %}">Network</a>
        <a href="/config"    class="nav-link {% if active=='config' %}active{% endif %}">Config</a>
      </nav>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 text-xs text-ink-500">
          <span class="status-dot pulse-live"></span>
          <span class="font-medium">Live</span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Main content -->
<main class="max-w-[1680px] mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="mt-16 border-t border-cream-200">
  <div class="max-w-[1680px] mx-auto px-6 py-6 flex items-center justify-between text-xs text-ink-400">
    <span class="font-serif italic">Honeypot-derived threat intelligence</span>
    <span class="font-mono">TAXII 2.1 · STIX · auto-pipeline</span>
  </div>
</footer>

</body>
</html>
