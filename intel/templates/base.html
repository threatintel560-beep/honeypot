<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-200">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HoneyForge Intel{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .link { @apply text-sky-400 hover:text-sky-300 underline-offset-4 hover:underline; }
  .chip { @apply inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium; }
  .chip-crit { @apply bg-red-900/60 text-red-200 ring-1 ring-red-500/40; }
  .chip-high { @apply bg-orange-900/60 text-orange-200 ring-1 ring-orange-500/40; }
  .chip-med  { @apply bg-yellow-900/60 text-yellow-200 ring-1 ring-yellow-500/40; }
  .chip-low  { @apply bg-green-900/60 text-green-200 ring-1 ring-green-500/40; }
  .chip-kev  { @apply bg-fuchsia-900/60 text-fuchsia-200 ring-1 ring-fuchsia-500/40; }
  .chip-new  { @apply bg-sky-900/60 text-sky-200 ring-1 ring-sky-500/40; }
  .chip-drafted { @apply bg-amber-900/60 text-amber-200 ring-1 ring-amber-500/40; }
  .chip-deployed { @apply bg-emerald-900/60 text-emerald-200 ring-1 ring-emerald-500/40; }
  .chip-reviewed { @apply bg-teal-900/60 text-teal-200 ring-1 ring-teal-500/40; }
  .chip-draft { @apply bg-slate-700 text-slate-200; }
  .btn       { @apply inline-flex items-center gap-1.5 rounded-md bg-slate-800 px-3 py-1.5 text-sm font-medium text-slate-100 ring-1 ring-slate-700 hover:bg-slate-700; }
  .btn-primary { @apply inline-flex items-center gap-1.5 rounded-md bg-sky-600 px-3 py-1.5 text-sm font-medium text-white ring-1 ring-sky-500 hover:bg-sky-500; }
  .btn-danger  { @apply inline-flex items-center gap-1.5 rounded-md bg-red-600 px-3 py-1.5 text-sm font-medium text-white ring-1 ring-red-500 hover:bg-red-500; }
  .nav-link { @apply inline-flex items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white; }
  .nav-link.active { @apply bg-slate-800 text-white ring-1 ring-slate-700; }
  .card { @apply rounded-lg bg-slate-900 ring-1 ring-slate-800 p-5; }
  table.data { @apply w-full text-sm text-left; }
  table.data thead { @apply bg-slate-900 text-slate-400 text-xs uppercase tracking-wider; }
  table.data th, table.data td { @apply px-3 py-2 border-b border-slate-800; }
  table.data tbody tr:hover { @apply bg-slate-900/50; }
  input, select, textarea { @apply bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-1 focus:ring-sky-500; }
  label { @apply block text-sm font-medium text-slate-300 mb-1; }
  .hint { @apply text-xs text-slate-500 mt-1; }
</style>
</head>
<body class="min-h-full">
<header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
    <a href="/" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      HoneyForge <span class="text-slate-500 font-normal">Intel</span>
    </a>
    <nav class="flex gap-1">
      <a href="/"        class="nav-link {% if active=='dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/cves"    class="nav-link {% if active=='cves' %}active{% endif %}">CVEs</a>
      <a href="/plugins" class="nav-link {% if active=='plugins' %}active{% endif %}">Plugins</a>
      <a href="/iocs"    class="nav-link {% if active=='iocs' %}active{% endif %}">IOCs</a>
      <a href="/config"  class="nav-link {% if active=='config' %}active{% endif %}">Config</a>
    </nav>
  </div>
</header>
<main class="max-w-7xl mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>
</body>
</html>
