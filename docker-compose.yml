services:
  # ──────────────── Honeypot services ────────────────
  ssh-honeypot:
    build:
      context: .
      dockerfile: services/ssh/Dockerfile
    container_name: hp-ssh
    restart: unless-stopped
    ports:
      - "${SSH_PORT:-2222}:2222"
    env_file: .env
    volumes:
      - ./logs/ssh:/var/log/honeypot
      - ./services/ssh/host_key:/app/host_key
    networks:
      - honeynet
    # Lock down outbound — attackers should not pivot from the honeypot
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false

  http-honeypot:
    build:
      context: .
      dockerfile: services/http/Dockerfile
    container_name: hp-http
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - ./logs/http:/var/log/honeypot
      - ./services/http/plugins:/app/plugins:ro
    networks:
      - honeynet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ──────────────── Product-specific honeypots ────────────────
  # Each spoofs a specific product on its native port.
  # Censys/Shodan will index these as the real product.
  # Uncomment the ones you want to run.

  fortinet-honeypot:
    build:
      context: .
      dockerfile: services/http/Dockerfile
    container_name: hp-fortinet
    restart: unless-stopped
    ports:
      - "${FORTINET_PORT:-10443}:8080"
    env_file: .env
    environment:
      - HONEYPOT_PRODUCT=fortinet
      - HTTP_LISTEN_PORT=8080
      - HONEY_DEPLOYMENT_ID=hp-fortinet-01
    volumes:
      - ./logs/http:/var/log/honeypot
      - ./services/http/plugins:/app/plugins:ro
    networks:
      - honeynet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles: ["products"]

  paloalto-honeypot:
    build:
      context: .
      dockerfile: services/http/Dockerfile
    container_name: hp-paloalto
    restart: unless-stopped
    ports:
      - "${PALOALTO_PORT:-4443}:8080"
    env_file: .env
    environment:
      - HONEYPOT_PRODUCT=paloalto
      - HTTP_LISTEN_PORT=8080
      - HONEY_DEPLOYMENT_ID=hp-paloalto-01
    volumes:
      - ./logs/http:/var/log/honeypot
      - ./services/http/plugins:/app/plugins:ro
    networks:
      - honeynet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles: ["products"]

  citrix-honeypot:
    build:
      context: .
      dockerfile: services/http/Dockerfile
    container_name: hp-citrix
    restart: unless-stopped
    ports:
      - "${CITRIX_PORT:-8443}:8080"
    env_file: .env
    environment:
      - HONEYPOT_PRODUCT=citrix
      - HTTP_LISTEN_PORT=8080
      - HONEY_DEPLOYMENT_ID=hp-citrix-01
    volumes:
      - ./logs/http:/var/log/honeypot
      - ./services/http/plugins:/app/plugins:ro
    networks:
      - honeynet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles: ["products"]

  # ──────────────── Logging pipeline ────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.13.4}
    container_name: hp-filebeat
    user: root
    restart: unless-stopped
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/honeypot:ro
    networks:
      - honeynet
    depends_on:
      - logstash

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.13.4}
    container_name: hp-logstash
    restart: unless-stopped
    volumes:
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    networks:
      - honeynet
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.13.4}
    container_name: hp-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - honeynet

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.13.4}
    container_name: hp-kibana
    restart: unless-stopped
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - honeynet
    depends_on:
      - elasticsearch

  # ──────────────── Threat intel module ────────────────
  intel:
    build:
      context: .
      dockerfile: intel/Dockerfile
    container_name: hp-intel
    restart: unless-stopped
    ports:
      - "${INTEL_PORT:-8090}:8090"
    env_file: .env
    volumes:
      - intel_data:/data
      - ./services/http/plugins:/app/generated_plugins
    extra_hosts:
      # lets the intel container call Ollama running on the Mac/Win host
      - "host.docker.internal:host-gateway"
    networks:
      - honeynet
    depends_on:
      - elasticsearch

networks:
  honeynet:
    driver: bridge

volumes:
  es_data:
  intel_data:
